<!DOCTYPE html>
<html>
<head>
    <title>T3_056</title>
</head>
<body>
    <h2>Program Nilai Minimum, Maksimum, dan Rata-rata</h2>
    <p id="hasil"></p>

    <script>
        function hitungArray(arr) {
            let min = arr[0];
            let max = arr[0];
            let total = 0;

            for (let i = 0; i < arr.length; i++) {
                if (arr[i] < min) {
                    min = arr[i];
                }

                if (arr[i] > max) {
                    max = arr[i];
                }

                total += arr[i];
            }

            let rataRata = total / arr.length;

            return {
                minimum: min,
                maksimum: max,
                rataRata: rataRata
            };
        }

        let data = [10, 20, 30, 40, 50];
        let hasil = hitungArray(data);

        document.getElementById("hasil").innerHTML =
            "Nilai Minimum: " + hasil.minimum + "<br>" +
            "Nilai Maksimum: " + hasil.maksimum + "<br>" +
            "Nilai Rata-rata: " + hasil.rataRata;
    </script>
</body>
</html>
